name: Pre-release

# Every green CI run of a push to master becomes a "vX.Y.Z-ci.N" pre-release, which the app's
# Pre-release update channel offers, unless nothing the app ships changed since the last one: a merge of
# text only (tools/ci_scope.py) would be offered as an update that changes nothing. Only the newest 10 are kept.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: write
  actions: read

# One at a time, in the order CI finished: each compares with the build the one before it published.
concurrency:
  group: prerelease
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RUN: ${{ github.event.workflow_run.run_number }}
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  ships:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      ships: ${{ steps.ships.outputs.ships }}
    steps:
      # The workflow's own revision, master's tip: its tools, even when CI re-ran an older build, and every
      # commit and tag, so the build is compared by its SHA.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Does anything that ships differ from the last CI pre-release?
        id: ships
        run: |
          # the newest build by its run number: a re-run of an older run publishes after a newer one
          last="$(gh release list --limit 200 --json tagName,isPrerelease | python3 -I tools/ci_prereleases.py newest)" ||
            last=""
          # whatever cannot be read publishes, as before
          scope=full
          if [ -n "${last}" ] && base="$(git rev-list -n 1 "refs/tags/${last}")" &&
            files="$(git -c core.quotePath=false diff --no-renames --name-only "${base}" "${HEAD_SHA}")"; then
            scope="$(printf '%s\n' "${files}" | python3 -I tools/ci_scope.py)"
          fi
          echo "since ${last:-no CI pre-release}: ${scope}"
          if [ "${scope}" = text ]; then ships=false; else ships=true; fi
          echo "ships=${ships}" >> "$GITHUB_OUTPUT"

  prerelease:
    needs: ships
    if: needs.ships.outputs.ships == 'true'
    runs-on: ubuntu-latest
    steps:
      # the workflow's own revision for its tools; the build's commit only for its version
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: build
      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Checksums
        working-directory: dist
        run: sha256sum OpenWrtGUI-Setup-*.exe > SHA256SUMS.txt
      - name: Create the pre-release
        run: |
          BASE="$(PYTHONPATH=build/src python3 -c 'from openwrtgui.version import BASE_VERSION as v; print(v)')"
          VERSION="${BASE}-ci.${RUN}"
          gh release create "v${VERSION}" --prerelease --target "${HEAD_SHA}" \
            --title "OpenWrtGUI ${VERSION}" --notes "CI build of ${HEAD_SHA}" \
            dist/OpenWrtGUI-Setup-*.exe dist/SHA256SUMS.txt
      - name: Keep the newest 10 CI pre-releases
        run: |
          # a list it cannot read fails the step, so pre-releases cannot pile up unseen
          set -o pipefail
          gh release list --limit 200 --json tagName,isPrerelease | python3 -I tools/ci_prereleases.py beyond 10 |
          while read -r tag; do
            gh release delete "${tag}" --cleanup-tag -y
          done
