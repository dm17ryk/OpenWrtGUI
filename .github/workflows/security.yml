name: Security audit

# Known advisories in the packages the app ships block a pull request; advisories in build and test tools only
# warn. Not part of ci.yml, which release.yml calls: an advisory published overnight must not stop a release
# that is otherwise ready (v1.0b1 D10). A pull request that changes only Markdown or docs/ changes no package,
# and a pull request runs on its own event only (a push to its branch would audit it a second time).

on:
  push:
    branches: [master]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  schedule:
    - cron: "41 4 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-deps:
    # pip-audit skips requirements whose markers are false where it runs: the installer ships the win32 ones
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --extra dev
      - name: Shipped Python packages
        # the app and what the installer bundles; dev tools never ship
        run: |
          mkdir -p build
          uv export --frozen --no-emit-project --extra build --format requirements-txt --output-file build/requirements-audit.txt
          uv run pip-audit --disable-pip --require-hashes --progress-spinner off -r build/requirements-audit.txt

  npm-deps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Shipped UI packages
        run: npm audit --omit=dev --audit-level=high
      - name: Build and test tools (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high
