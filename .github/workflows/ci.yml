name: CI

# A pull request runs on its own event only (a push to its branch would run everything a second time).
# It runs the jobs its files need (tools/ci_scope.py): text only, the Python job, whose tests read CHANGELOG,
# README and SECURITY.md; docs/manual, the frontend job too, as the app bundles the manual as its help;
# anything else, every job. A push to master and a release (workflow_call) run every job.

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Which jobs this change needs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        # a pull request's checkout is its merge commit: the first parent is the base it merges into
        run: |
          if [ "$EVENT" = pull_request ] &&
            files="$(git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD)"; then
            scope="$(printf '%s\n' "$files" | python3 -I tools/ci_scope.py)"
          else
            scope=full
          fi
          echo "scope=$scope" | tee -a "$GITHUB_OUTPUT"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --extra dev
      - name: Lint
        run: |
          uv run ruff check src tests tools packaging/make_icon.py
          uv run ruff format --check src tests tools packaging/make_icon.py
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov=openwrtgui --cov-report=term --cov-fail-under=80
      - name: OpenAPI schema
        run: uv run python tools/dump_openapi.py
      - uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: build/openapi.json
          if-no-files-found: error

  frontend:
    needs: [changes, python]
    if: needs.changes.outputs.scope != 'text'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: openapi
          path: build
      - name: API types match the backend
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.ts
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  e2e:
    needs: [changes, python, frontend]
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --extra dev
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the UI and install Chromium
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run build
      - name: Playwright against the simulator
        working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots
          path: frontend/e2e-screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report

  windows:
    needs: [changes, python, frontend]
    if: needs.changes.outputs.scope == 'full'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --extra build
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Inno Setup
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Version
        id: base
        run: |
          $base = uv run python -c "from openwrtgui.version import BASE_VERSION as v; print(v)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "base=$base" >> $env:GITHUB_OUTPUT
      - name: Build
        run: ./tools/build_windows.ps1 -Version "${{ steps.base.outputs.base }}-ci.${{ github.run_number }}"
      - name: The latest release, for the update test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "${{ github.repository }}" --pattern "OpenWrtGUI-Setup-*.exe" --dir build/previous
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, update, check and uninstall
        run: ./tools/test_installer.ps1 -Previous (Get-ChildItem build/previous/OpenWrtGUI-Setup-*.exe).FullName
      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/OpenWrtGUI-Setup-*.exe
          if-no-files-found: error

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
