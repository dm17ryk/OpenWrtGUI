name: CodeQL

# A pull request that changes only Markdown or docs/ changes no code to analyse. Every push to master is
# analysed, unfiltered: CodeQL compares a pull request with master's latest analysis.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths-ignore: ["**.md", "docs/**"]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
