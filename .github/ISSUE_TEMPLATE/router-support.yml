name: New router support
description: A router or firmware image that OpenWrtGUI does not handle well yet.
labels: ["router-support"]
body:
  - type: markdown
    attributes:
      value: |
        OpenWrtGUI reads a router's self-description the way LuCI does, so most OpenWrt routers work
        without code changes. When one does not, these outputs let us add it without the hardware.
        Remove passwords, keys, IMEIs and public addresses before you paste.
  - type: input
    id: image
    attributes:
      label: Firmware image
      description: A download link for the image, or its name and version.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What does not work
    validations:
      required: true
  - type: textarea
    id: board
    attributes:
      label: Output of `ubus call system board`
      render: json
    validations:
      required: true
  - type: textarea
    id: board-json
    attributes:
      label: Contents of `/etc/board.json`
      render: json
    validations:
      required: true
  - type: textarea
    id: iw-phy
    attributes:
      label: Output of `iw phy`
      render: text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else (optional)
      description: For example `ubus -v list`, or custom packages in the image.
      render: text
