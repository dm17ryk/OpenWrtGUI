[project]
name = "openwrtgui"
version = "0.2.0"
description = "Windows desktop app for operating the OpenWrt routers of a Wi-Fi test bench"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "websockets",
    "asyncssh",
    "pywebview",
    "psutil",
    "httpx",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-psutil",
    "pyyaml",
    "types-pyyaml",
]
build = [
    "pyinstaller",
    "pillow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openwrtgui"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
# ASYNC109: the transport contract takes a per-command timeout that the SSH layer passes to asyncssh.
# ASYNC240: small local file writes (downloads, audit lines) run on the single-user event loop on purpose.
ignore = ["ASYNC109", "ASYNC240"]

[tool.mypy]
strict = true
files = ["src/openwrtgui"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["webview", "webview.*", "asyncssh", "asyncssh.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["hardware: needs a real router (AP2)"]
addopts = "-m 'not hardware'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["openwrtgui"]
omit = ["*/openwrtgui/main.py"]
